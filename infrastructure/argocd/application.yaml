apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ArghyadiptaGoswami4259/DEV_OPS_LAB_CAPSTONE.git
    targetRevision: main
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: taskflow-prod
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
